<svg viewBox="0 0 140 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Left wing -->
  <path d="M10 8 L58 50 L10 92 Z" fill="#3b82f6"/>
  <path d="M10 8 L58 50 L10 92 Z" fill="url(#leftGrad)"/>

  <!-- Right wing -->
  <path d="M130 8 L82 50 L130 92 Z" fill="#3b82f6"/>
  <path d="M130 8 L82 50 L130 92 Z" fill="url(#rightGrad)"/>

  <!-- Center knot -->
  <circle cx="70" cy="50" r="14" fill="#3b82f6"/>
  <circle cx="70" cy="50" r="10" fill="#2563eb"/>

  <!-- Gradients for depth -->
  <defs>
    <linearGradient id="leftGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="rightGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
</svg>
